<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laracamp — Berhasil Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7839f3;
      --purple-light: #f5efff;
      --purple-border: #ece3fe;
      --green: #31b380;
      --dark: #211b3d;
      --gray: #5b5575;
      --gray-light: #e7e5f4;
    }
    body { font-family: 'Poppins', sans-serif; color: var(--dark); background: #fff; }

    /* NAV */
    nav {
      background: #fff;
      box-shadow: 0 6px 60px 0 rgba(22,28,51,0.06);
      height: 80px;
      display: flex; align-items: center;
      padding: 0 100px;
    }
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-logo-icon {
      width: 32px; height: 32px;
      background: var(--purple); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo-icon svg { width: 18px; height: 18px; }
    .nav-logo-text { font-size: 22px; font-weight: 500; color: var(--dark); }
    .nav-menu { display: flex; gap: 40px; margin: 0 auto 0 60px; list-style: none; }
    .nav-menu a { text-decoration: none; font-size: 15px; color: var(--dark); }
    .nav-menu a.active { color: var(--purple); }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    .btn-outline {
      padding: 10px 28px; border-radius: 47px;
      border: 2px solid var(--purple-border);
      background: var(--purple-light);
      color: var(--purple); font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none;
    }
    .btn-primary {
      padding: 10px 28px; border-radius: 47px;
      background: var(--purple);
      color: #fff; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: inline-block;
      border: none;
    }

    /* SUCCESS */
    .success-page {
      min-height: calc(100vh - 80px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 100px;
      text-align: center;
    }
    .success-illustration {
      width: 340px; height: 340px; margin-bottom: 40px;
      background: linear-gradient(135deg, #ede9fe 0%, #c4b5fd 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 120px;
      overflow: hidden; position: relative;
    }
    .success-illustration img {
      width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0;
      padding: 20px;
    }
    .success-label {
      font-size: 14px; font-weight: 600; color: var(--green);
      letter-spacing: 0.05em; margin-bottom: 10px;
    }
    .success-title {
      font-size: 36px; font-weight: 600; color: var(--dark); margin-bottom: 32px;
    }
    .btn-dashboard {
      padding: 14px 48px; border-radius: 47px;
      background: var(--purple); color: #fff;
      font-size: 16px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: inline-block;
      border: none; font-family: 'Poppins', sans-serif;
    }
    .btn-dashboard:hover { background: #6520e0; }
    .confetti {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden; z-index: -1;
    }
    .confetti-piece {
      position: absolute; width: 10px; height: 20px; border-radius: 2px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </div>
    <span class="nav-logo-text">laracamp</span>
  </a>
  <ul class="nav-menu">
    <li><a href="#" class="active">Program</a></li>
    <li><a href="#">Mentor</a></li>
    <li><a href="#">Pricing</a></li>
    <li><a href="#">Business</a></li>
  </ul>
  <div class="nav-actions">
    <a href="login.html" class="btn-outline">Sign In</a>
    <a href="login.html" class="btn-primary">Sign Up</a>
  </div>
</nav>

<!-- CONFETTI -->
<div class="confetti" id="confetti"></div>

<!-- SUCCESS -->
<div class="success-page">
  <div class="success-illustration">
    <img src="http://localhost:3845/assets/3dbcd7443fcbc56408a033b4cf2474f5b44f3f9d.png" alt="Success" onerror="this.style.display='none'">
    🎉
  </div>
  <p class="success-label">WHAT A DAY!</p>
  <h1 class="success-title">Berhasil Checkout</h1>
  <a href="dashboard.html" class="btn-dashboard">My Dashboard</a>
</div>

<script>
  // Generate confetti
  const confettiContainer = document.getElementById('confetti');
  const colors = ['#7839f3', '#31b380', '#f59e0b', '#ef4444', '#3b82f6', '#ec4899'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (Math.random() * 3 + 2) + 's';
    piece.style.animationDelay = (Math.random() * 3) + 's';
    piece.style.width = (Math.random() * 10 + 6) + 'px';
    piece.style.height = (Math.random() * 14 + 10) + 'px';
    confettiContainer.appendChild(piece);
  }
</script>

</body>
</html>
