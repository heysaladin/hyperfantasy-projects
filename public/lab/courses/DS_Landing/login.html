<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laracamp — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7839f3;
      --purple-light: #f5efff;
      --purple-border: #ece3fe;
      --purple-dark: #4d1cab;
      --green: #31b380;
      --dark: #211b3d;
      --gray: #5b5575;
      --gray-light: #e7e5f4;
    }
    body { font-family: 'Poppins', sans-serif; color: var(--dark); background: #fff; height: 100vh; overflow: hidden; }

    .login-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
    }

    /* LEFT PANEL */
    .login-left {
      background: var(--purple-dark);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 60px; position: relative; overflow: hidden;
    }
    .login-left-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #4d1cab 0%, #6d28d9 60%, #7839f3 100%);
    }
    .left-illustration {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 20px;
    }
    .left-people {
      display: flex; flex-direction: row-reverse; gap: -10px;
    }
    .avatar-circle {
      width: 60px; height: 60px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      background: #9061f9;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; font-weight: 600;
      margin-left: -12px;
    }
    .avatar-circle:first-child { margin-left: 0; }
    .avatar-more {
      width: 60px; height: 60px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff; font-weight: 600;
      margin-left: -12px;
    }
    .left-text { position: relative; z-index: 1; }
    .left-text p { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 40px; }
    .money-card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
      border-radius: 20px; padding: 24px 28px;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.2);
      margin-bottom: 20px;
    }
    .money-card-label { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; }
    .money-card-value { color: #fff; font-size: 28px; font-weight: 600; }
    .money-card-sub { color: var(--green); font-size: 12px; font-weight: 500; }
    .money-badge {
      background: var(--green); color: #fff; border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 500;
    }

    /* RIGHT PANEL */
    .login-right {
      display: flex; flex-direction: column; justify-content: center;
      padding: 60px 80px;
    }
    .login-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 48px; text-decoration: none; }
    .login-logo-icon {
      width: 32px; height: 32px; background: var(--purple); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .login-logo-icon svg { width: 18px; height: 18px; }
    .login-logo-text { font-size: 22px; font-weight: 500; color: var(--dark); }
    .login-subtitle { font-size: 13px; color: var(--gray); margin-bottom: 6px; }
    .login-title { font-size: 24px; font-weight: 600; color: var(--dark); margin-bottom: 36px; }
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px 28px; border-radius: 47px;
      border: 1px solid var(--gray-light);
      background: #fff; color: var(--dark);
      font-size: 15px; font-weight: 500; cursor: pointer;
      text-decoration: none; width: 100%; max-width: 370px;
      transition: border-color 0.2s;
    }
    .btn-google:hover { border-color: var(--purple); }
    .google-icon {
      width: 20px; height: 20px;
    }
    .divider {
      display: flex; align-items: center; gap: 16px;
      max-width: 370px; margin: 28px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--gray-light);
    }
    .divider span { font-size: 13px; color: var(--gray); }
    .form-group { margin-bottom: 20px; max-width: 370px; }
    .form-label { font-size: 14px; color: var(--dark); margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%; padding: 12px 20px; border-radius: 47px;
      border: 1px solid var(--gray-light); font-size: 15px;
      font-family: 'Poppins', sans-serif; color: var(--dark);
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--purple); }
    .btn-primary {
      padding: 12px 28px; border-radius: 47px;
      background: var(--purple); color: #fff;
      font-size: 15px; font-weight: 500; cursor: pointer;
      border: none; font-family: 'Poppins', sans-serif;
      width: 100%; max-width: 370px; text-align: center;
    }
    .login-footer { margin-top: 20px; font-size: 14px; color: var(--gray); max-width: 370px; }
    .login-footer a { color: var(--purple); text-decoration: none; font-weight: 500; }

    /* Right panel people section */
    .people-stack {
      display: flex; margin-bottom: 60px;
    }
    .people-stack .avatar-circle { margin-left: -14px; }
    .people-stack .avatar-circle:first-child { margin-left: 0; }
  </style>
</head>
<body>

<div class="login-layout">
  <!-- LEFT -->
  <div class="login-left">
    <div class="login-left-bg"></div>

    <div class="money-card">
      <div>
        <div class="money-card-label">Total Earning</div>
        <div class="money-card-value">$80,500</div>
        <div class="money-card-sub">+12% this month</div>
      </div>
      <div class="money-badge">+12%</div>
    </div>

    <div class="people-stack">
      <div class="avatar-circle">F</div>
      <div class="avatar-circle">A</div>
      <div class="avatar-circle">J</div>
      <div class="avatar-circle">M</div>
      <div class="avatar-circle">B</div>
      <div class="avatar-circle">R</div>
      <div class="avatar-circle">S</div>
      <div class="avatar-circle">K</div>
      <div class="avatar-more">+99</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="login-right">
    <a href="index.html" class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
      </div>
      <span class="login-logo-text">laracamp</span>
    </a>

    <p class="login-subtitle">Because tomorrow become never</p>
    <h2 class="login-title">Start Today</h2>

    <a href="dashboard.html" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign In with Google
    </a>

    <div class="divider"><span>or</span></div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" class="form-input" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="window.location.href='dashboard.html'">Sign In</button>

    <div class="login-footer">
      Don't have an account? <a href="#">Sign Up here</a>
    </div>
  </div>
</div>

</body>
</html>
