  <script>

  <style>

  <!-- BREADCRUMB -->
  <section class="bg-gray-100 py-8 px-4">
    <div class="container mx-auto">
      <ul class="breadcrumb">
        <li><a href="home.html">Home</a></li>
        <li><a href="#" aria-current="page">Success Checkout</a></li>
      </ul>
    </div>
  </section>

  <!-- SUCCESS CONTENT -->
  <section class="container mx-auto min-h-screen flex items-center justify-center px-4 py-16">
    <div class="w-full md:w-5/12 text-center">
      <img src="images/content/illustration-success.png" alt="Success" class="mx-auto mb-8 max-w-xs" />
      <h2 class="text-3xl md:text-4xl font-semibold mb-4">Ah yes it's success!</h2>
      <p class="text-gray-600 mb-8 leading-7">
        Pesanan kamu sudah kami terima dan sedang kami proses dengan penuh kasih sayang. Terima kasih sudah belanja di LuxSpace!
      </p>
      <a href="home.html" class="bg-red-200 text-black hover:bg-black hover:text-red-200 rounded-full px-10 py-3 inline-block transition duration-200 font-semibold">
        Back to Shop
      </a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-gray-200 text-center px-4 py-8">
    <p class="text-sm">Copyright 2021 • All Rights Reserved LuxSpace by BuildWith Angga</p>
  </footer>

  <script>
    document.getElementById('menu-toggler').addEventListener('click', () => {
      const m = document.getElementById('menu');
      m.classList.toggle('invisible'); m.classList.toggle('opacity-0');
      m.classList.toggle('visible'); m.classList.toggle('opacity-100');
    });
  </script>
</body>
</html>
