<!DOCTYPE html>
<html style="margin:0;padding:0;background:white">
<head>
<meta charset="UTF-8">
<title>Discover 13 - Map Vector Style</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:white">
<div style="width:1440px;height:900px;position:relative;overflow:hidden;font-family:'Poppins',sans-serif;background:white">

  <!-- Map background -->
  <div style="position:absolute;left:280px;top:100px;width:1160px;height:800px;background:#f6f5f8;overflow:hidden">
    <!-- Route overlay -->
    <img src="assets/direct2.png" style="position:absolute;left:121px;top:429px;width:773px;height:273px;display:block">
    <!-- Group18 vertical line -->
    <img src="assets/group18.png" style="position:absolute;left:118px;top:277px;width:12px;height:399px;display:block">
  </div>

  <!-- Sidebar blur edge -->
  <div style="position:absolute;left:186px;top:0;width:104px;height:900px;background:#e6e7e8;filter:blur(50px);opacity:0.5"></div>
  <!-- Sidebar white panel -->
  <div style="position:absolute;left:0;top:0;width:280px;height:900px;background:white"></div>

  <!-- Avatar circle -->
  <div style="position:absolute;left:80px;top:70px;width:120px;height:120px">
    <img src="assets/ellipse1.png" style="width:100%;height:100%;display:block">
  </div>
  <!-- Profile photo -->
  <div style="position:absolute;left:88px;top:78px;width:105px;height:105px;overflow:hidden;border-radius:50%">
    <img src="assets/image4.png" style="width:100%;height:100%;object-fit:cover;display:block">
  </div>
  <!-- Badge -->
  <div style="position:absolute;left:123px;top:170px;width:34px;height:34px">
    <img src="assets/group2.png" style="width:100%;height:100%;display:block">
  </div>
  <!-- Name -->
  <p style="position:absolute;left:140px;top:216px;transform:translateX(-50%);font-size:18px;font-weight:600;color:#212325;margin:0;white-space:nowrap">Shayna Setiawan</p>
  <!-- Title -->
  <p style="position:absolute;left:140px;top:245px;transform:translateX(-50%);font-size:14px;color:#a1a5b1;margin:0;white-space:nowrap">Product Manager</p>

  <!-- Stats -->
  <p style="position:absolute;left:70px;top:316px;transform:translateX(-50%);font-size:24px;font-weight:600;color:#212325;margin:0;white-space:nowrap;text-align:center">4.8</p>
  <p style="position:absolute;left:70.5px;top:354px;transform:translateX(-50%);font-size:14px;color:#a1a5b1;margin:0;white-space:nowrap;text-align:center">My Top Rate</p>
  <p style="position:absolute;left:210px;top:316px;transform:translateX(-50%);font-size:24px;font-weight:600;color:#212325;margin:0;white-space:nowrap;text-align:center">15</p>
  <p style="position:absolute;left:210.5px;top:354px;transform:translateX(-50%);font-size:14px;color:#a1a5b1;margin:0;white-space:nowrap;text-align:center">Completed</p>
  <!-- Dashed divider -->
  <div style="position:absolute;left:140px;top:316px;width:1px;height:60px;border-left:1px dashed #a1a6af"></div>

  <!-- Nearby nav item (active) -->
  <div style="position:absolute;left:14px;top:426px;width:252px;height:58px;background:#f5f5f5;border-radius:21px"></div>
  <div style="position:absolute;left:30px;top:442px;width:26px;height:26px"><img src="assets/ic-discover.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:443px;font-size:16px;font-weight:600;color:#212325;margin:0">Nearby</p>
  <!-- Orders nav item -->
  <div style="position:absolute;left:30px;top:520px;width:26px;height:26px"><img src="assets/ic-order-gray.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:521px;font-size:16px;color:#212325;margin:0">Orders</p>
  <!-- Inbox nav item -->
  <div style="position:absolute;left:30px;top:588px;width:26px;height:26px"><img src="assets/ic-message-gray.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:589px;font-size:16px;color:#212325;margin:0">Inbox</p>
  <!-- Wallet nav item -->
  <div style="position:absolute;left:30px;top:656px;width:26px;height:26px"><img src="assets/ic-payment-gray.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:657px;font-size:16px;color:#212325;margin:0">Wallet</p>
  <!-- Account nav item -->
  <div style="position:absolute;left:30px;top:724px;width:26px;height:26px"><img src="assets/ic-account-gray.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:725px;font-size:16px;color:#212325;margin:0">Account</p>
  <!-- Help & Support nav item -->
  <div style="position:absolute;left:30px;top:792px;width:26px;height:26px"><img src="assets/ic-settings-gray.png" style="width:100%;height:100%;display:block"></div>
  <p style="position:absolute;left:68px;top:793px;font-size:16px;color:#212325;margin:0">Help &amp; Support</p>

  <!-- Header -->
  <div style="position:absolute;left:280px;top:0;width:1160px;height:100px;background:white"></div>
  <p style="position:absolute;left:330px;top:20px;font-size:24px;font-weight:600;color:#212325;margin:0;white-space:nowrap">Nearby</p>
  <p style="position:absolute;left:330px;top:59px;font-size:14px;color:#a1a5b1;margin:0;white-space:nowrap">Get their money today</p>

  <!-- User pin -->
  <div style="position:absolute;left:401px;top:483px;width:50px;height:50px"><img src="assets/group19.png" style="width:100%;height:100%;display:block"></div>

  <!-- ic_order (gray) -->
  <div style="position:absolute;left:1113px;top:737px;width:46px;height:46px"><img src="assets/ic-order.png" style="width:100%;height:100%;display:block"></div>
  <!-- ic_order_selected (blue) at top position -->
  <div style="position:absolute;left:614px;top:255px;width:46px;height:46px"><img src="assets/ic-order-selected.png" style="width:100%;height:100%;display:block"></div>
  <!-- ic_order_selected at right area -->
  <div style="position:absolute;left:1182px;top:326px;width:46px;height:46px"><img src="assets/ic-order-selected.png" style="width:100%;height:100%;display:block"></div>

  <!-- Distance pill (9.2KM) -->
  <div style="position:absolute;left:858px;top:658px;width:81px;height:81px;display:flex;align-items:center;justify-content:center">
    <div style="transform:rotate(-45.03deg)">
      <div style="background:white;height:34px;width:80px;border-radius:24px;box-shadow:4px 4px 15px 0 rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:center">
        <span style="font-size:14px;font-weight:600;color:#212325;text-align:center">9.2KM</span>
      </div>
    </div>
  </div>

  <!-- Job card bottom-right (Trello Setup) -->
  <div style="position:absolute;left:1051px;top:569px;width:170px;height:157px">
    <img src="assets/union-d13.png" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block">
    <div style="position:absolute;left:12px;top:12px;width:146px;height:76px;overflow:hidden;border-radius:8px">
      <img src="assets/image9-d13.png" style="width:100%;height:100%;object-fit:cover;display:block">
    </div>
    <p style="position:absolute;left:12px;top:95px;font-size:12px;font-weight:500;color:#212325;margin:0;white-space:nowrap">Trello Setup</p>
    <p style="position:absolute;left:12px;top:115px;font-size:12px;color:#a1a5b1;margin:0;white-space:nowrap">$9,000</p>
    <div style="position:absolute;left:98px;top:102px;width:60px;height:24px;background:#055ffc;border-radius:100px;display:flex;align-items:center;justify-content:center">
      <span style="font-size:10px;font-weight:600;color:white">Details</span>
    </div>
  </div>

</div>
</body>
</html>
